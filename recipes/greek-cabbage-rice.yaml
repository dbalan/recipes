title: Greek Cabbage Rice (Lahanorizo)
description: Simple yet comforting Greek dish made with tender cabbage, rice, and a rich tomato-infused broth
source: https://www.themediterraneandish.com/wprm_print/greek-cabbage-rice-lahanorizo
categories:
  - main-course
  - side-dish
  - greek
  - vegetarian
servings: 6
prep_time_minutes: 20
cook_time_minutes: 60
author: Ruth Bardis
ingredients:
  - name: green cabbage
    qty: 1 medium
    size: "1 1/2 pounds"
    prep: outer leaves discarded, halved, cored, sliced into 1cm thick strips
  - name: extra virgin olive oil
    qty: "1/2 cup"
  - name: white onion
    qty: "1 large"
    prep: diced
  - name: leek
    qty: "1 cup"
    prep: thinly sliced, white parts only
  - name: carrot
    qty: "1 medium"
    prep: thinly sliced
  - name: celery
    qty: "1 stalk"
    prep: thinly sliced
  - name: kosher salt
    prep: to taste
  - name: garlic
    qty: "2 cloves"
    prep: minced
  - name: tomato paste
    qty: "3 tablespoons"
  - name: Sweet Spanish paprika
    qty: "1 teaspoon"
    prep: optional
  - name: bay leaves
    qty: "2"
  - name: medium grain rice
    qty: "1 cup"
    prep: Arborio or Carnaroli
  - name: freshly ground black pepper
    prep: to taste
  - name: lemon
    qty: "1"
    prep: juiced
  - name: parsley
    qty: "1/2 cup"
    prep: chopped
  - name: feta cheese
    qty: 1 cup
    prep: crumbled
preparation:
  - name: Prep vegetables
    prep: Discard outer leaves of cabbage, halve, core, then slice into 1 centimeter thick strips.
  - name: Sauté vegetables
    prep: |
      In a wide pot with a lid, heat the extra virgin olive oil over medium heat. Add onion and leek, cooking until soft and translucent, about 10 minutes. Stir in carrot and celery, season with salt, and cover. Cook for another 5 minutes. Add garlic and tomato paste, stirring to combine. Cook for 1 more minute, then add paprika, if using.
  - name: Cook cabbage
    prep: |
      Add the sliced cabbage to the pot along with bay leaves and 1 cup water. The cabbage will seem like a lot, but it will wilt as it cooks. Sprinkle with salt, cover, and reduce heat to medium-low. Cook for 20 to 25 minutes, stirring occasionally to prevent sticking. If the pot looks dry, add 1/2 cup water. Once the cabbage is softened, continue cooking for another 10 minutes, if needed, until fully tender. Meanwhile, bring 4 cups of water to a boil in a separate pot or kettle.
  - name: Add rice
    prep: |
      After 20 to 25 minutes, the cabbage should be wilted and softened. If the cabbage is still relatively crunchy, cook for an additional 10 minutes or until it is soft. Stir in rice, and season with a big pinch of salt and black pepper. Add 3 1/2 cups of boiling water. Mix through and taste the cooking liquid. It should be well-salted at this stage.
  - name: Cover and cook
    prep: |
      Place the lid on the pot and cook on low heat for 15 minutes or until the rice is tender. Open the lid and check if the stew has enough liquid; add another 1/2 cup of boiling water if you want it saucier. Stir and immediately remove from heat, keeping the lid on for 10 minutes.
  - name: Finish and serve
    prep: Stir in the lemon juice, taste, and adjust seasoning as needed. Top with 1 cup crumbled feta cheese, freshly ground black pepper, and 1/2 cup chopped parsley.
